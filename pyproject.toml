[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inbox-automation"
version = "1.0.0"
description = "Watch an IMAP mailbox, classify mail by rules, extract fields, trigger actions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Konstantin Konradi", email = "info@fynaxa.de" }]
keywords = ["imap", "email", "automation", "parsing", "idempotency"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
inbox-automation = "inbox_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
